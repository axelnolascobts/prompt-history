<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pokedex.css">
    <title>Pokedex</title>
</head>
<body>
    <section id="center-pokedex" class="center-pokedex">
        <section id="pokedex-container" class="pokedex-container">
            <!--<section id="screen-container" class="screen-container">
                <article id="screen" class="screen">
                    <p id="pokemon-name" class="pokemon-text"></p>
                    <img alt="pokemonImage" id="pokemon-image" class="pokemon-image">
                    <p id="pokemon-id" class="pokemon-text"></p>
                    <p id="pokemon-types" class="pokemon-text"></p>
                </article>
    
            </section>-->

            <section id="form-container" class="form-container">
                <form id="pokemon-form" class="pokemon-form">
                    <input type="text" name="pokemon" id="pokemon" class="pokemon">
                </form>
                <section id="button-container" class="button-container">
                    <button id="search-button" class="search-button"></button>
                </section>
                <form id="pokedex-settings" class="pokedex-settings">
                    <select name="Type" id="type-selector" required>
                        <option value="" disabled selected>Filter with type</option>
                    </select>
                </form>
                <section id="filter-button-container" class="button-container">
                    <button id="filter-button" class="search-button"></button>
                </section>
                
            </section>
 
        </section>
        <section id="list-container" class="list-container">
            <section id="list-screen" class="list-screen">
                <article id="right-screen" class="right-screen">
                    <div id="pokemon-list" class="pokemon-list">


                    </div>

                </article>

            </section>

        </section>

    </section>
    
    <script src="pokedex.js"></script>
</body>
</html>
