<!DOCTYPE html>
<html>
<head>
  <title>Chat simple</title>
</head>
<body>

<h1>Chat en tiempo real</h1>

<ul id="messages"></ul>

<form id="form">
  <input id="input" autocomplete="off" placeholder="Escribe tu mensaje" />
  <button>Enviar</button>
</form>


<script>
  const socket = io();

  let nombre = '';
  while (!nombre) {
    nombre = prompt('Ingresa tu nombre:');
  }

  socket.emit('nuevo usuario', nombre);

  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const messages = document.getElementById('messages');

  form.addEventListener('submit', function(event) {
    event.preventDefault();
    if (input.value) {
      socket.emit('chat message', { nombre, mensaje: input.value });
      input.value = '';
    }
  });

  socket.on('chat message', function(data) {
    const item = document.createElement('li');
    item.textContent = `[${data.nombre}] ${data.mensaje}`;
    messages.appendChild(item);
    
  });

  socket.on('usuario conectado', function(nombreUsuario) {
    const item = document.createElement('li');
    item.textContent = ` ${nombreUsuario} se ha conectado `;
    messages.appendChild(item);
    
  });

  socket.on('usuario desconectado', function(nombreUsuario) {
    const item = document.createElement('li');
    item.textContent = ` ${nombreUsuario} se ha desconectado `;
    messages.appendChild(item);
    
  });
</script>
</body>
</html>
