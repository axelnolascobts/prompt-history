<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles pokemon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <section class="pokedex_carcasa_2">
        <button id="back_button" class="back_button">
            <a href="index.html">Regresar</a>
        </button>
        <button id="darkModeButton">Modo Oscuro</button>
        <div class="bordes_2">
            <div id="details" class="container">
                <h2>Sprites:</h2>
                <div id="sprites" class="details-sprites"></div>

                
                <h2>Name:</h2>
                <p class="p" id="pokename"></p>

                <h2>Type(s)</h2>
                <p class="p" id="types"></p>    

                <h2>Height:</h2>
                <p id="height" class="p"></p>

                <h2>Weight:</h2>
                <p id="weight" class="p"></p>

                <h2>Abilitie(s):</h2>
                <p id="ability" class="p"></p>
            </div>
        </div>
    </section>

    <script src="detalles.js"></script>
</body>
</html>
