<!DOCTYPE html>

    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pokedex_carcasa">

            <button class="search" id="search"></button>

                    <!-- Parte 2: Lista -->

    </div>
        </div>
