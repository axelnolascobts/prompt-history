<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Tic Tac Toe</title>
</head>
<body>
    <section id="cont-gen">
      <!--   camelCase
        kebab-case
        UpperCammelCase
        UPPERCASE
        lowercase
        snake_case

        buenas practicas 

        let playerX = "x"; (camelCase para variables)

        <div id="main-header" class="main-header"></div> (kebab-case para clases y id)

        const PI = 3.1416; (UPPERCASE para nombres de constantes)

        patient_id  (snake_case para bases de datos)

        PatientAddress (camelCase también se puede usar para bases de datos)

        ticTacToe.js (camelCase para nombres de archivos (también es correcto lowercase)) -->

        <header id="header">
            <article id="titulo">
                <h1>TIC-TAC-TOE</h1>
            </article>
            
            <article id="counters">
                <div class="counter">
                    <p>Victorias de X: </p>
                    <p id="victoriesX"></p>
                </div>
                <div class="counter">
                    <p>Victorias de O: </p>
                    <p id="victoriesO"></p>
                </div>

            </article>
            <article id="turnos">
                <p id="turnoA"></p>
            </article>
            <article id="boton">
                <button id="restartBot">REINICIAR</button>
            </article>
        </header>
        <section id="cont-game">
            <article id="grid-cont">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </article>
        </section>
    </section>
    <script src="tictactoe.js"></script>
</body>
</html>
