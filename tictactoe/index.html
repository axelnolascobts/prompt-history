<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Tic Tac Toe</title>
</head>
<body>
    <section id="cont-gen">

        <header id="header">
            <article id="titulo">
                <h1>TIC-TAC-TOE</h1>
            </article>
            
            <article id="counters">
                <div class="counter">
                    <p>Victorias de X: </p>
                    <p id="victoriesX"></p>
                </div>
                <div class="counter">
                    <p>Victorias de O: </p>
                    <p id="victoriesO"></p>
                </div>

            </article>
            <article id="turnos">
                <p id="turnoA"></p>
            </article>
            <article id="boton">
                <button id="restartBot">REINICIAR</button>
            </article>
        </header>
        <section id="cont-game">
            <article id="grid-cont">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </article>
        </section>
    </section>
    <script src="tictactoe.js"></script>
</body>
</html>
