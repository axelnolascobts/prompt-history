<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <h1>Real-time Chat</h1>
  <ul id="messages"></ul>
  <form id="form">


<input id="input" autocomplete="off" 
placeholder="Write your message, maximum 500 characters" maxlength="500" />


    <button type="submit">Send</button>
  </form>

  <ul id="chats"></ul>
  <div id="private-chats"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const privateChats = {};

    // Pedir nombre de usuario
    let name = '';
    function askName() {
      while (!name || name.trim().length < 1) {
        alert("Please insert your name")
        name = prompt('Insert your name: (maxinum 30 characters)');
      }
      while (name.length > 30) {
        alert("You exceed the maximum characters for a name, choose another name shorter")
        name = prompt('Insert your name: (maxinum 30 characters)');
      }
      socket.emit('new user', name);
    }
    askName();

    socket.on('username exists', () => {
      alert('That username already exists, please choose another one.');
      name = '';
      askName();
    });

    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const delete_button = document.getElementById('delete_button')
    const chats = document.getElementById('chats')
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (input.value.trim()) {
        const msgId = Math.random().toString(36);
        socket.emit('chat message', { id: msgId, name, message: input.value.trim() });
        input.value = '';
      }
    });

    // Mostrar mensajes entrantes
    socket.on('chat message', (data) => {
      const item = document.createElement('li');
      item.textContent = `[${data.name}] ${data.message}`;

      // Si el mensaje es del usuario actual, agrega botón eliminar
      if (data.name === name) {
        const delBtn = document.createElement('button');
        delBtn.textContent = 'Eliminar';
        delBtn.onclick = () => {
          socket.emit('delete message', data.id);
        };
        item.appendChild(delBtn);
      }
      // Guarda el id del mensaje en el elemento
      item.dataset.id = data.id; 
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    });

    // Escucha mensajes eliminados
    socket.on('message deleted', (id) => {
      const items = messages.querySelectorAll('li');
      items.forEach(item => {
        if (item.dataset.id === id) {
          item.textContent = 'Se eliminó el mensaje';
        }
      });
    });

    // Mostrar usuarios para chatear
    socket.on('chats', (usernames) => {
      chats.innerHTML = "";
      usernames.forEach(username => {
        if(username === name);
        return;
        const item = document.createElement('li');
        item.textContent = `[${username}]`;
        item.style.cursor = 'pointer';

        item.onclick = () => {
          if(!privateChats[username]) {
            createPrivateChatWindow(username);
          }
        };
        chats.appendChild(item);
      });
      chats.scrollTop = chats.scrollHeight;
    });

    // Mostrar notificación de usuario conectado
    socket.on('user connected', (username) => {
      const item = document.createElement('li');
      item.textContent = `${username} its connected`;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    });

    // Mostrar notificación de usuario desconectado
    socket.on('user disconnected', (username) => {
      const item = document.createElement('li');
      item.textContent = `${username} its disconnected`;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    });

    //pagina para crear chat
    function createPrivateChatWindow(username) {
      if (document.getElementById(`chat-${username}`));
      return;
      const chatBox = document.createElement('div');
      chatBox.className = 'private-chat-box'; //agregar estilo despues
      chatBox.id = `chat-${username}`;

      const title = document.createElement('h3');
      title.textContent = `Chat con ${username}`;
      chatBox.appendChild(title);

      const messageList = document.createElement('ul');
      messageList.className = 'private-messages' //agregar estilo despues
      chatBox.appendChild(messageList);

      const formList = document.createElement('form');
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'insert a message...';

      const sendBtn = document.createElement('button');
      sendBtn.textContent = 'send';
      form.appendChild('input');
      form.appendChild('sendBtn');

      form.onsubmit = (e) => {
        e.preventDefault();
        const message = input.value.trim();
        if (message) {
          const msgId = Math.random().toString(36);
          socket.emit('private message',{ to: username, message, id: msgId });
          input.value = '';
        }};
    };
  </script>
</body>
</html>
